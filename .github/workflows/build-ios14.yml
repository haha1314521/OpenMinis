name: build-ios-ipa
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: submodule tags
        run: git submodule foreach --recursive 'git fetch --tags --force' || true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: toolchain
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_26.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app 2>/dev/null || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install meson ninja llvm lld libarchive pkg-config || true
          (pip3 install --break-system-packages meson || true)
          LLVM_PREFIX=$(brew --prefix llvm)
          export PATH="$LLVM_PREFIX/bin:/opt/homebrew/opt/lld/bin:$PATH"
          ln -sf "$LLVM_PREFIX/bin/ld64.lld" /opt/homebrew/bin/ld64.lld 2>/dev/null || true
          clang --version; ld64.lld --version || true
          echo "PATH=$PATH" >> $GITHUB_ENV
          which meson || true
          which go || true

      - name: config templates
        run: |
          cp -n src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig || true
          cp -n src/android/app/provider-customization.properties.example src/android/app/provider-customization.properties || true
          ls -l src/ios/Configs

      - name: cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
          key: deps-${{ runner.os }}-${{ hashFiles('deps/*.sh', 'deps/ish/**') }}

      - name: deps
        run: |
          set -x
          ./deps/build_lame.sh || echo "LAME_FAILED"
          ./deps/build_ffmpeg.sh || echo "FFMPEG_FAILED"
          ./deps/build_ish.sh || echo "ISH_FAILED"
          ./deps/prepare_alpine_rootfs.sh || echo "ROOTFS_FAILED"
          ./deps/build_rclone_ios.sh || echo "RCLONE_FAILED"
          ls deps/frameworks deps/libs deps/resources 2>/dev/null | head -40

      - name: resolve packages + patch iOS15 APIs
        run: |
          cd src/ios
          xcodebuild -resolvePackageDependencies -project Minis.xcodeproj -scheme Minis || true
          xcodebuild -resolvePackageDependencies -project Minis.xcodeproj -scheme Minis -derivedDataPath build_dd || true
          cd ../..
          python3 .github/ci/patch_swift14.py
          python3 .github/ci/patch_pbxproj.py
          python3 .github/ci/patch_deps.py

      - name: free space
        run: |
          df -h /
          rm -rf deps/ish/build-ios deps/ish/deps/libarchive/build 2>/dev/null || true
          du -sh deps/* 2>/dev/null | sort -h | tail -6
          df -h /

      - name: xcodebuild iOS14
        run: |
          set -o pipefail
          cd src/ios
          xcodebuild -project Minis.xcodeproj -scheme Minis -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build_dd -jobs 2 ONLY_ACTIVE_ARCH=YES \
            SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal SWIFT_COMPILATION_MODE=singlefile \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -500

      - name: package ipa
        if: always()
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Minis.app" -path "*Release-iphoneos*" | head -1)
          echo "APP=$APP"
          if [ -n "$APP" ]; then
            rm -rf Payload && mkdir -p Payload
            cp -R "$APP" Payload/
            zip -qr Minis-unsigned.ipa Payload
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minis-build
          path: |
            Minis-unsigned.ipa
            src/ios/build.log
          if-no-files-found: warn
